<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memories</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
</head>
<body>
  <!-- Semantic Search Banner -->
  <div id="semantic-banner" class="semantic-banner hidden">
    <span>🔍 To enable semantic search, <a href="#" id="semantic-banner-link">click here</a> to download a model.</span>
    <button class="banner-close" id="semantic-banner-close" aria-label="Close">&times;</button>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <h1 class="app-title">Memories</h1>
    </div>
    <div class="header-center">
      <div id="search-container" class="search-container">
        <input type="text" id="omni-search" class="omni-search" placeholder="Search memories..." autocomplete="off">
        <div id="search-results" class="search-results hidden"></div>
      </div>
    </div>
    <div class="header-right">
      <button id="network-toggle" class="icon-btn" title="Network Graph">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="12" cy="18" r="3"/>
          <line x1="8.5" y1="7.5" x2="10.5" y2="16"/><line x1="15.5" y1="7.5" x2="13.5" y2="16"/>
        </svg>
      </button>
      <button id="theme-toggle" class="icon-btn" title="Toggle Theme">
        <svg id="theme-icon-light" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg id="theme-icon-dark" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <button id="settings-btn" class="icon-btn" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33
            1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06
            a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09
            A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06
            A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51
            1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9
            a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="app-main">
    <!-- Section List (Left Panel) -->
    <aside id="sections-panel" class="panel sections-panel">
      <div class="panel-header">
        <h2>Sections</h2>
      </div>
      <ul id="section-list" class="section-list"></ul>
    </aside>

    <!-- Tiles Panel (Middle) -->
    <section id="tiles-panel" class="panel tiles-panel">
      <div class="panel-header">
        <h2 id="tiles-heading">All Memories</h2>
        <button id="new-memory-btn" class="btn-primary">+ New Memory</button>
      </div>
      <!-- Bulk Action Bar -->
      <div id="bulk-bar" class="bulk-bar hidden">
        <span id="bulk-count">0 selected</span>
        <button id="bulk-select-all" class="btn-small">Select All</button>
        <button id="bulk-delete" class="btn-small btn-danger">Delete</button>
        <button id="bulk-tag" class="btn-small">Tag</button>
        <button id="bulk-remove-tag" class="btn-small">Remove Tag</button>
        <button id="bulk-move" class="btn-small">Move</button>
        <button id="bulk-clear" class="btn-small">Clear</button>
      </div>
      <div id="tiles-container" class="tiles-container"></div>
    </section>

    <!-- Detail Panel (Right) -->
    <section id="detail-panel" class="panel detail-panel">
      <div id="detail-content" class="detail-content">
        <div class="detail-empty">
          <p>Select a memory to view details</p>
        </div>
      </div>
    </section>

    <!-- Network View (replaces middle+right) -->
    <section id="network-panel" class="panel network-panel hidden">
      <div class="panel-header">
        <h2>Network Graph</h2>
        <button id="network-close" class="btn-small">Close</button>
      </div>
      <div id="network-container" class="network-container"></div>
      <div id="network-flyout" class="network-flyout hidden">
        <div id="network-flyout-content" class="detail-content"></div>
      </div>
    </section>

    <!-- Settings Page (replaces all panels) -->
    <section id="settings-panel" class="panel settings-panel hidden">
      <div class="panel-header">
        <h2>Settings</h2>
        <button id="settings-close" class="btn-small">Close</button>
      </div>
      <div id="settings-content" class="settings-content"></div>
    </section>
  </main>

  <!-- Dialogs -->
  <div id="dialog-overlay" class="dialog-overlay hidden">
    <div id="dialog-box" class="dialog-box">
      <h3 id="dialog-title"></h3>
      <div id="dialog-body"></div>
      <div class="dialog-actions">
        <button id="dialog-cancel" class="btn-small">Cancel</button>
        <button id="dialog-confirm" class="btn-small btn-primary">Confirm</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
